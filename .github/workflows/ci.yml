name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: mayi, POSTGRES_PASSWORD: mayi, POSTGRES_DB: mayi }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mayi" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @mayi/site build
      - run: pnpm --filter @mayi/server build
      - run: pnpm --filter @mayi/server build:vercel
      - run: pnpm --filter @mayi/server build:cloudflare
      - run: pnpm db:migrate
        env: { DATABASE_URL: "postgres://mayi:mayi@localhost:5432/mayi" }
  deploy-site:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_SITE_DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cloudflare-site-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mayi/site build
      - name: Deploy landing site and docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config apps/site/wrangler.jsonc
  deploy-cloudflare:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply production database migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          pnpm db:migrate
      - name: Configure Cloudflare bindings
        env:
          HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
        run: |
          test -n "$HYPERDRIVE_ID"
          sed -i "s/REPLACE_WITH_HYPERDRIVE_ID/$HYPERDRIVE_ID/" wrangler.toml
      - run: pnpm --filter @mayi/server build:cloudflare
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECEIPT_PRIVATE_JWK: ${{ secrets.RECEIPT_PRIVATE_JWK }}
          RECEIPT_PUBLIC_JWK: ${{ secrets.RECEIPT_PUBLIC_JWK }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$RECEIPT_PRIVATE_JWK"
          test -n "$RECEIPT_PUBLIC_JWK"
          test -n "$CRON_SECRET"
          secrets_file="$RUNNER_TEMP/mayi-worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n \
            --arg receipt_private_jwk "$RECEIPT_PRIVATE_JWK" \
            --arg receipt_public_jwk "$RECEIPT_PUBLIC_JWK" \
            --arg cron_secret "$CRON_SECRET" \
            '{RECEIPT_PRIVATE_JWK: $receipt_private_jwk, RECEIPT_PUBLIC_JWK: $receipt_public_jwk, CRON_SECRET: $cron_secret}' \
            > "$secrets_file"
          pnpm exec wrangler deploy --config wrangler.toml --secrets-file "$secrets_file"
