<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" fill="none">
  <!-- The receipt mark. Colours are resolved here rather than by the page because a
       favicon renders outside the document: prefers-color-scheme is the only theme
       signal available to it, so the site's .dark toggle cannot reach it. The check
       brightens to the dark-scheme hover indigo (#4c40fe) because at 16px the flat
       brand blue (#3d2fd6) has too little contrast against a dark tab strip. -->
  <style>
    .paper { stroke: #15181a; }
    .check { stroke: #3d2fd6; }
    @media (prefers-color-scheme: dark) {
      .paper { stroke: #e8eae7; }
      .check { stroke: #4c40fe; }
    }
  </style>
  <path class="paper" d="M7 3.5H21V21.5L19.25 24L17.5 21.5L15.75 24L14 21.5L12.25 24L10.5 21.5L8.75 24L7 21.5Z" stroke-width="2" stroke-linejoin="round"/>
  <path class="check" d="M9.75 12.75L12.75 15.75L18.25 9.25" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
