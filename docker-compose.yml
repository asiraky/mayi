services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mayi
      POSTGRES_PASSWORD: mayi
      POSTGRES_DB: mayi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mayi"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  app:
    build: .
    profiles: ["full"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://mayi:mayi@postgres:5432/mayi
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      RECEIPT_ISSUER: ${RECEIPT_ISSUER:-${PUBLIC_ORIGIN:-http://localhost:3000}}
      RECEIPT_AUDIENCE: ${RECEIPT_AUDIENCE:-local-executor}
      RECEIPT_PRIVATE_JWK: ${RECEIPT_PRIVATE_JWK}
      RECEIPT_PUBLIC_JWK: ${RECEIPT_PUBLIC_JWK}
      RECEIPT_PREVIOUS_PUBLIC_JWKS: ${RECEIPT_PREVIOUS_PUBLIC_JWKS:-[]}
      OBJECT_STORE: ${OBJECT_STORE:-filesystem}
      OBJECT_DIRECTORY: /var/lib/mayi/objects
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      CONSUMER_API_KEYS: ${CONSUMER_API_KEYS:-{}}
      EMAIL_API_URL: ${EMAIL_API_URL:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      AUTH_TRUSTED_IP_HEADER: ${AUTH_TRUSTED_IP_HEADER:-x-forwarded-for}
      OAUTH_REGISTRATION_TRUSTED_IP_HEADER: ${OAUTH_REGISTRATION_TRUSTED_IP_HEADER:-x-forwarded-for}
    ports: ["127.0.0.1:${APP_PORT:-3000}:3000"]
    volumes: ["artefacts:/var/lib/mayi/objects"]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    environment:
      MAYI_DOMAIN: ${MAYI_DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes: ["./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data"]
volumes:
  postgres-data:
  artefacts:
  caddy-data:
