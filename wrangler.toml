name = "may-i"
main = "deploy/cloudflare-worker.ts"
compatibility_date = "2026-07-14"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "app.mayi.sh"
custom_domain = true

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_HYPERDRIVE_ID"

[[r2_buckets]]
binding = "ARTEFACTS"
bucket_name = "may-i-artefacts"

[triggers]
crons = ["* * * * *"]

[assets]
directory = "apps/server/.output/public"
binding = "ASSETS"
